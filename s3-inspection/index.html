<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Adaptive Phishing Detection</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;background:#070b14;color:#eef2ff;display:flex;justify-content:center;align-items:center;padding:24px}.app{width:100%;max-width:900px}.header{text-align:center;margin-bottom:28px}.header h1{margin:0 0 8px;font-size:34px}.header p{margin:0;color:#9aa5bd}.card{background:#101624;border:1px solid #202a3d;border-radius:18px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.28)}.input-row{display:flex;gap:12px}input{flex:1;min-width:0;background:#080d18;color:#fff;border:1px solid #29344b;border-radius:12px;padding:15px 16px;font-size:16px;outline:none}input:focus{border-color:#667eea}button{border:0;border-radius:12px;padding:0 24px;background:#667eea;color:white;font-size:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.status,.error{display:none;margin-top:18px;padding:14px;border-radius:12px}.status{background:#0b1220;color:#aeb9d0}.error{background:#2a1116;border:1px solid #5b2630;color:#ffb4bd}.result{display:none;margin-top:22px}.decision{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:22px;border-radius:15px;background:#0b1220;border:1px solid #202a3d}.label{font-size:28px;font-weight:800;text-transform:uppercase}.risk{margin-top:6px;color:#aeb9d0}.confidence{text-align:right;font-size:25px;font-weight:800}.url{margin-top:14px;padding:12px;background:#080d18;border-radius:10px;color:#9aa5bd;word-break:break-all;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.item{background:#0b1220;border:1px solid #202a3d;border-radius:12px;padding:15px}.item span{display:block;color:#7f8ba5;font-size:12px;margin-bottom:7px;text-transform:uppercase;letter-spacing:.06em}.item strong{font-size:15px}@media(max-width:650px){.input-row{flex-direction:column}button{height:50px}.decision{flex-direction:column;align-items:flex-start}.confidence{text-align:left}.grid{grid-template-columns:1fr}}
</style></head>
<body><main class="app"><div class="header"><h1>Adaptive Phishing Detection</h1><p>Analyze a URL using machine learning and security intelligence.</p></div><section class="card"><div class="input-row"><input id="urlInput" type="url" placeholder="https://example.com" autocomplete="off"><button id="analyzeBtn">Analyze URL</button></div><div id="status" class="status">Analyzing URL...</div><div id="error" class="error"></div><div id="result" class="result"><div class="decision"><div><div id="label" class="label">Unknown</div><div id="risk" class="risk">Risk: —</div></div><div id="confidence" class="confidence">—%</div></div><div id="url" class="url"></div><div class="grid"><div class="item"><span>Decision Basis</span><strong id="basis">—</strong></div><div class="item"><span>Recommended Action</span><strong id="action">—</strong></div><div class="item"><span>ML Probability</span><strong id="ml">—</strong></div><div class="item"><span>Typosquatting</span><strong id="typo">—</strong></div><div class="item"><span>Known Phishing</span><strong id="knownPhishing">—</strong></div><div class="item"><span>Known Malware</span><strong id="knownMalware">—</strong></div></div></div></section></main>
<script>
const API_URL="https://v43zg3og23.execute-api.ap-southeast-2.amazonaws.com/analyze";const input=document.getElementById("urlInput"),button=document.getElementById("analyzeBtn"),status=document.getElementById("status"),errorBox=document.getElementById("error"),result=document.getElementById("result");
function resetUI(){errorBox.style.display="none";result.style.display="none";status.style.display="none"}function showError(m){errorBox.textContent=m;errorBox.style.display="block"}function prob(v){return typeof v==="number"?(v*100).toFixed(2)+"%":"—"}
async function analyzeURL(){const url=input.value.trim();resetUI();if(!url)return showError("Please enter a URL.");try{new URL(url)}catch{return showError("Please enter a valid URL, including https:// or http://.")}button.disabled=true;status.style.display="block";try{const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url})});const d=await r.json();if(!r.ok)throw new Error(d.error||"API request failed.");const dec=d.decision||{},sum=d.summary||{},ev=d.evidence||{},ml=ev.machine_learning||{},th=ev.threat_intelligence||{},ty=ev.typosquatting||{};document.getElementById("label").textContent=dec.label||"unknown";document.getElementById("risk").textContent="Risk: "+(dec.risk_level||"unknown");document.getElementById("confidence").textContent=typeof dec.confidence==="number"?dec.confidence.toFixed(1)+"%":"—";document.getElementById("url").textContent=d.url||url;document.getElementById("basis").textContent=dec.decision_basis||"—";document.getElementById("action").textContent=sum.recommended_action||"—";document.getElementById("ml").textContent=prob(ml.phishing_probability);document.getElementById("typo").textContent=ty.detected?"Detected":"Not detected";document.getElementById("knownPhishing").textContent=th.known_phishing?"Yes":"No";document.getElementById("knownMalware").textContent=th.known_malware?"Yes":"No";result.style.display="block"}catch(e){showError(e.message||"Unable to connect to the analysis API.")}finally{status.style.display="none";button.disabled=false}}button.addEventListener("click",analyzeURL);input.addEventListener("keydown",e=>{if(e.key==="Enter")analyzeURL()});
</script></body></html>
